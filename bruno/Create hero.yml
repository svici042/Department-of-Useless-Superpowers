info:
  name: Create hero
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:3000/heroes
  body:
    type: json
    data: |-
      {
        "name": "Reaper",
        "power": "Can stop hair growth for 3 seconds",
        "limitation": "He is bald.",
        "usefulness": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
